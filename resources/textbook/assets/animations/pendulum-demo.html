<script>
// ============================================================
// 双摆动力学仿真 — 基于拉格朗日方程
// ============================================================

// ---------- 物理参数 ----------
let m1 = 1.0;       // 质量1 (kg)
let m2 = 1.0;       // 质量2 (kg)
let L1 = 1.0;       // 杆长1 (m)
let L2 = 1.0;       // 杆长2 (m)
let damping = 0.0;  // 阻尼系数
let g = 9.8;        // 重力加速度 (m/s²)

// ---------- 状态变量 (弧度) ----------
let theta1, theta2;  // 角度
let omega1, omega2;  // 角速度

// ---------- 初始角度 (度) ----------
let initTheta1Deg = 120;
let initTheta2Deg = 90;

// ---------- 仿真控制 ----------
let running = false;
const DT = 0.01;           // 固定积分步长 (秒)
let lastFrameTime = 0;     // 上一帧时间戳
let simTime = 0;           // 仿真累计时间

// ---------- 轨迹记录 ----------
let trajectory = [];              // 摆锤2的运动轨迹 (物理坐标)
const MAX_TRAJECTORY = 500;       // 最多保留500个点

// ---------- 能量历史 ----------
let energyHistory = [];           // 能量历史数据 {K, V, E}
const MAX_ENERGY_HISTORY = 600;   // 最多保留600个点 (~6秒)

// ---------- 拖拽状态 ----------
let dragging = null;      // null / 1 / 2
let wasRunning = false;   // 拖拽前是否在运行

// ---------- Canvas 引用 ----------
const simCanvas = document.getElementById('simCanvas');
const simCtx = simCanvas.getContext('2d');
const energyCanvas = document.getElementById('energyCanvas');
const energyCtx = energyCanvas.getContext('2d');

// ============================================================
// Canvas 尺寸设置 (支持高分屏 HiDPI)
// ============================================================
function setupCanvas(canvas, ctx) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, rect.width);
  const h = Math.max(1, rect.height);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 重置变换，避免累积缩放
}

function resizeAll() {
  setupCanvas(simCanvas, simCtx);
  setupCanvas(energyCanvas, energyCtx);
}

// ============================================================
// 物理模型 — 拉格朗日方程推导的运动方程
// ============================================================

// 计算角加速度 α₁ (θ₁的二阶导)
// 公式由双摆拉格朗日方程推导得出
function computeAlpha1(t1, t2, w1, w2) {
  const delta = t1 - t2;
  const denom = L1 * (2 * m1 + m2 - m2 * Math.cos(2 * delta));
  const num = -g * (2 * m1 + m2) * Math.sin(t1)
            - m2 * g * Math.sin(t1 - 2 * t2)
            - 2 * Math.sin(delta) * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(delta));
  return num / denom;
}

// 计算角加速度 α₂ (θ₂的二阶导)
function computeAlpha2(t1, t2, w1, w2) {
  const delta = t1 - t2;
  const denom = L2 * (2 * m1 + m2 - m2 * Math.cos(2 * delta));
  const num = 2 * Math.sin(delta) * (
    w1 * w1 * L1 * (m1 + m2)
    + g * (m1 + m2) * Math.cos(t1)
    + w2 * w2 * L2 * m2 * Math.cos(delta)
  );
  return num / denom;
}

// 动能 K
function computeKineticEnergy() {
  return 0.5 * m1 * (L1 * omega1) ** 2
       + 0.5 * m2 * ((L1 * omega1) ** 2 + (L2 * omega2) ** 2
       + 2 * L1 * L2 * omega1 * omega2 * Math.cos(theta1 - theta2));
}

// 势能 V (以支点为参考零点)
function computePotentialEnergy() {
  return -(m1 + m2) * g * L1 * Math.cos(theta1)
       - m2 * g * L2 * Math.cos(theta2);
}

// ============================================================
// RK4 数值积分 (四阶龙格-库塔法)
// 对双摆这种混沌系统，RK4比欧拉法精度高得多
// ============================================================
function rk4Step(dt) {
  // 状态向量: [θ₁, θ₂, ω₁, ω₂]
  // 导数函数 (含粘性阻尼项 -damping*ω)
  function derivs(t1, t2, w1, w2) {
    const a1 = computeAlpha1(t1, t2, w1, w2) - damping * w1;
    const a2 = computeAlpha2(t1, t2, w1, w2) - damping * w2;
    return [w1, w2, a1, a2];
  }

  const k1 = derivs(theta1, theta2, omega1, omega2);
  const k2 = derivs(
    theta1 + k1[0]*dt/2, theta2 + k1[1]*dt/2,
    omega1 + k1[2]*dt/2, omega2 + k1[3]*dt/2
  );
  const k3 = derivs(
    theta1 + k2[0]*dt/2, theta2 + k2[1]*dt/2,
    omega1 + k2[2]*dt/2, omega2 + k2[3]*dt/2
  );
  const k4 = derivs(
    theta1 + k3[0]*dt, theta2 + k3[1]*dt,
    omega1 + k3[2]*dt, omega2 + k3[3]*dt
  );

  theta1 += (k1[0] + 2*k2[0] + 2*k3[0] + k4[0]) * dt / 6;
  theta2 += (k1[1] + 2*k2[1] + 2*k3[1] + k4[1]) * dt / 6;
  omega1 += (k1[2] + 2*k2[2] + 2*k3[2] + k4[2]) * dt / 6;
  omega2 += (k1[3] + 2*k2[3] + 2*k3[3] + k4[3]) * dt / 6;
}

// ============================================================
// 单步仿真
// ============================================================
function stepSimulation(dt) {
  rk4Step(dt);
  simTime += dt;

  // 数值安全检查：防止发散时产生NaN
  if (!isFinite(theta1) || !isFinite(theta2) ||
      !isFinite(omega1) || !isFinite(omega2)) {
    running = false;
    document.getElementById('startBtn').textContent = '开始';
    document.getElementById('liveDot').classList.remove('active');
    reset();
    return;
  }

  // 记录摆锤2轨迹 (物理坐标，相对于支点)
  const px = L1 * Math.sin(theta1) + L2 * Math.sin(theta2);
  const py = L1 * Math.cos(theta1) + L2 * Math.cos(theta2);
  trajectory.push({ x: px, y: py });
  if (trajectory.length > MAX_TRAJECTORY) trajectory.shift();

  // 记录能量历史
  const K = computeKineticEnergy();
  const V = computePotentialEnergy();
  energyHistory.push({ K, V, E: K + V });
  if (energyHistory.length > MAX_ENERGY_HISTORY) energyHistory.shift();
}

// ============================================================
// 渲染 — 主仿真画布
// ============================================================

// 获取缩放比例 (物理坐标 → 画布像素)
function getScale() {
  const w = simCanvas.clientWidth;
  const h = simCanvas.clientHeight;
  const maxLen = L1 + L2;
  return Math.min(w, h) * 0.4 / maxLen;
}

// 获取支点位置和缩放
function getPivot() {
  return {
    x: simCanvas.clientWidth / 2,
    y: simCanvas.clientHeight / 2,
    scale: getScale()
  };
}

// 绘制背景网格
function drawGrid() {
  const w = simCanvas.clientWidth;
  const h = simCanvas.clientHeight;
  simCtx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
  simCtx.lineWidth = 1;
  const step = 30;
  for (let x = 0; x <= w; x += step) {
    simCtx.beginPath();
    simCtx.moveTo(x, 0);
    simCtx.lineTo(x, h);
    simCtx.stroke();
  }
  for (let y = 0; y <= h; y += step) {
    simCtx.beginPath();
    simCtx.moveTo(0, y);
    simCtx.lineTo(w, y);
    simCtx.stroke();
  }
}

// 绘制摆锤2的运动轨迹 (淡色渐变线，旧→透明，新→青色)
function drawTrajectory(px, py, scale) {
  const n = trajectory.length;
  if (n < 2) return;
  // 分批绘制实现渐变效果 (旧轨迹透明，新轨迹清晰)
  const batches = 12;
  const batchSize = Math.ceil(n / batches);
  for (let b = 0; b < batches; b++) {
    const start = b * batchSize;
    const end = Math.min(start + batchSize + 1, n);
    if (end - start < 2) continue;
    const alpha = ((b + 1) / batches) * 0.65;
    simCtx.strokeStyle = 'rgba(8, 145, 178, ' + alpha + ')';
    simCtx.lineWidth = 1.5;
    simCtx.beginPath();
    simCtx.moveTo(px + trajectory[start].x * scale, py + trajectory[start].y * scale);
    for (let i = start + 1; i < end; i++) {
      simCtx.lineTo(px + trajectory[i].x * scale, py + trajectory[i].y * scale);
    }
    simCtx.stroke();
  }
}

// 绘制连杆 (蓝色渐变粗线)
function drawRod(x1, y1, x2, y2) {
  const grad = simCtx.createLinearGradient(x1, y1, x2, y2);
  grad.addColorStop(0, '#1e40af');
  grad.addColorStop(0.5, '#3b82f6');
  grad.addColorStop(1, '#1e40af');
  simCtx.strokeStyle = grad;
  simCtx.lineWidth = 6;
  simCtx.lineCap = 'round';
  simCtx.beginPath();
  simCtx.moveTo(x1, y1);
  simCtx.lineTo(x2, y2);
  simCtx.stroke();
}

// 绘制支点 (白色圆形)
function drawPivot(x, y) {
  // 外圈光晕
  const glow = simCtx.createRadialGradient(x, y, 0, x, y, 18);
  glow.addColorStop(0, 'rgba(255,255,255,0.15)');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  simCtx.fillStyle = glow;
  simCtx.beginPath();
  simCtx.arc(x, y, 18, 0, Math.PI * 2);
  simCtx.fill();
  // 支点主体
  simCtx.fillStyle = '#ffffff';
  simCtx.beginPath();
  simCtx.arc(x, y, 8, 0, Math.PI * 2);
  simCtx.fill();
  // 内圈装饰
  simCtx.fillStyle = '#64748b';
  simCtx.beginPath();
  simCtx.arc(x, y, 4, 0, Math.PI * 2);
  simCtx.fill();
}

// 质量块半径 (与质量成正比)
function massRadius(m) {
  return 6 + m * 3;  // m=0.5 → 7.5px, m=5 → 21px
}

// 绘制质量块 (带3D球体效果)
function drawMass(x, y, m, color, lightColor) {
  const r = massRadius(m);
  // 外光晕
  const glow = simCtx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.2);
  glow.addColorStop(0, color + '50');
  glow.addColorStop(1, color + '00');
  simCtx.fillStyle = glow;
  simCtx.beginPath();
  simCtx.arc(x, y, r * 2.2, 0, Math.PI * 2);
  simCtx.fill();
  // 主体 (径向渐变模拟3D球体)
  const grad = simCtx.createRadialGradient(x - r*0.35, y - r*0.35, 0, x, y, r);
  grad.addColorStop(0, lightColor);
  grad.addColorStop(0.6, color);
  grad.addColorStop(1, color);
  simCtx.fillStyle = grad;
  simCtx.beginPath();
  simCtx.arc(x, y, r, 0, Math.PI * 2);
  simCtx.fill();
  // 高光点
  simCtx.fillStyle = 'rgba(255,255,255,0.3)';
  simCtx.beginPath();
  simCtx.arc(x - r*0.35, y - r*0.35, r * 0.3, 0, Math.PI * 2);
  simCtx.fill();
  // 边框
  simCtx.strokeStyle = 'rgba(255,255,255,0.2)';
  simCtx.lineWidth = 1;
  simCtx.beginPath();
  simCtx.arc(x, y, r, 0, Math.PI * 2);
  simCtx.stroke();
}

// 主绘制函数
function drawSim() {
  const w = simCanvas.clientWidth;
  const h = simCanvas.clientHeight;

  // 背景径向渐变
  const bgGrad = simCtx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h) * 0.7);
  bgGrad.addColorStop(0, '#13243d');
  bgGrad.addColorStop(1, '#0f1b2d');
  simCtx.fillStyle = bgGrad;
  simCtx.fillRect(0, 0, w, h);

  // 背景网格
  drawGrid();

  const p = getPivot();
  const scale = p.scale;

  // 计算质量块画布坐标
  // θ从竖直向下方向测量，x = L*sin(θ), y = L*cos(θ)
  const x1 = p.x + L1 * Math.sin(theta1) * scale;
  const y1 = p.y + L1 * Math.cos(theta1) * scale;
  const x2 = x1 + L2 * Math.sin(theta2) * scale;
  const y2 = y1 + L2 * Math.cos(theta2) * scale;

  // 绘制轨迹 (最底层)
  drawTrajectory(p.x, p.y, scale);

  // 绘制连杆
  drawRod(p.x, p.y, x1, y1);
  drawRod(x1, y1, x2, y2);

  // 绘制支点
  drawPivot(p.x, p.y);

  // 绘制质量块 (m1蓝色, m2橙色)
  drawMass(x1, y1, m1, '#2563eb', '#60a5fa');
  drawMass(x2, y2, m2, '#f59e0b', '#fbbf24');

  // 拖拽时显示指示圈
  if (dragging) {
    const dx = dragging === 1 ? x1 : x2;
    const dy = dragging === 1 ? y1 : y2;
    const dr = dragging === 1 ? massRadius(m1) : massRadius(m2);
    simCtx.strokeStyle = 'rgba(255,255,255,0.5)';
    simCtx.lineWidth = 2;
    simCtx.setLineDash([4, 4]);
    simCtx.beginPath();
    simCtx.arc(dx, dy, dr + 6, 0, Math.PI * 2);
    simCtx.stroke();
    simCtx.setLineDash([]);
  }
}

// ============================================================
// 渲染 — 能量曲线图
// ============================================================
function drawEnergyChart() {
  const w = energyCanvas.clientWidth;
  const h = energyCanvas.clientHeight;
  energyCtx.clearRect(0, 0, w, h);

  // 水平网格线
  energyCtx.strokeStyle = 'rgba(255,255,255,0.05)';
  energyCtx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = (h * i) / 4;
    energyCtx.beginPath();
    energyCtx.moveTo(0, y);
    energyCtx.lineTo(w, y);
    energyCtx.stroke();
  }

  // 无数据时显示提示
  if (energyHistory.length < 2) {
    energyCtx.fillStyle = 'rgba(148,163,184,0.4)';
    energyCtx.font = '11px "Microsoft YaHei", sans-serif';
    energyCtx.textAlign = 'center';
    energyCtx.textBaseline = 'middle';
    energyCtx.fillText('点击"开始"后显示能量曲线', w / 2, h / 2);
    return;
  }

  // 计算能量范围 (自动缩放)
  let minE = Infinity, maxE = -Infinity;
  for (const e of energyHistory) {
    if (e.K < minE) minE = e.K;
    if (e.V < minE) minE = e.V;
    if (e.E < minE) minE = e.E;
    if (e.K > maxE) maxE = e.K;
    if (e.V > maxE) maxE = e.V;
    if (e.E > maxE) maxE = e.E;
  }
  const range = maxE - minE || 1;
  const pad = range * 0.15;
  minE -= pad;
  maxE += pad;
  const drawRange = maxE - minE;

  const n = energyHistory.length;
  const xStep = w / (n - 1);

  // 绘制单条曲线
  function drawCurve(key, color, lineWidth) {
    energyCtx.strokeStyle = color;
    energyCtx.lineWidth = lineWidth;
    energyCtx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = i * xStep;
      const y = h - ((energyHistory[i][key] - minE) / drawRange) * h;
      if (i === 0) energyCtx.moveTo(x, y);
      else energyCtx.lineTo(x, y);
    }
    energyCtx.stroke();
  }

  drawCurve('K', '#2563eb', 1.5);   // 动能 - 蓝色
  drawCurve('V', '#f59e0b', 1.5);   // 势能 - 橙色
  drawCurve('E', '#059669', 2);     // 总能量 - 绿色 (稍粗)
}

// ============================================================
// 更新数据显示
// ============================================================

// 角度归一化到 [-180, 180]
function normAngle(deg) {
  return ((deg + 180) % 360 + 360) % 360 - 180;
}

function updateDisplay() {
  const d1 = normAngle(theta1 * 180 / Math.PI);
  const d2 = normAngle(theta2 * 180 / Math.PI);

  document.getElementById('valTheta1').textContent = d1.toFixed(1) + '°';
  document.getElementById('valTheta2').textContent = d2.toFixed(1) + '°';
  document.getElementById('valOmega1').textContent = omega1.toFixed(2);
  document.getElementById('valOmega2').textContent = omega2.toFixed(2);

  const K = computeKineticEnergy();
  const V = computePotentialEnergy();
  document.getElementById('valK').textContent = K.toFixed(2) + ' J';
  document.getElementById('valV').textContent = V.toFixed(2) + ' J';
  document.getElementById('valE').textContent = (K + V).toFixed(2) + ' J';
  document.getElementById('legendTime').textContent = '仿真时间: ' + simTime.toFixed(1) + 's';
}

// ============================================================
// 重置到初始状态
// ============================================================
function reset() {
  theta1 = initTheta1Deg * Math.PI / 180;
  theta2 = initTheta2Deg * Math.PI / 180;
  omega1 = 0;
  omega2 = 0;
  trajectory = [];
  energyHistory = [];
  simTime = 0;
  lastFrameTime = 0;
}

// ============================================================
// 动画主循环 (requestAnimationFrame)
// ============================================================
function animate(timestamp) {
  if (running) {
    if (lastFrameTime === 0) lastFrameTime = timestamp;
    let frameTime = (timestamp - lastFrameTime) / 1000;
    lastFrameTime = timestamp;
    if (frameTime > 0.1) frameTime = 0.1; // 防止切换标签页后大跳变

    // 固定步长累加器：保证物理仿真步长恒定为DT
    let acc = frameTime;
    while (acc >= DT) {
      stepSimulation(DT);
      acc -= DT;
    }
  } else {
    lastFrameTime = 0;
  }

  drawSim();
  drawEnergyChart();
  updateDisplay();
  requestAnimationFrame(animate);
}

// ============================================================
// 滑块控件事件绑定
// ============================================================
function setupControls() {
  // 质量滑块
  document.getElementById('m1Slider').oninput = function(e) {
    m1 = parseFloat(e.target.value);
    document.getElementById('m1Val').textContent = m1.toFixed(1) + ' kg';
  };
  document.getElementById('m2Slider').oninput = function(e) {
    m2 = parseFloat(e.target.value);
    document.getElementById('m2Val').textContent = m2.toFixed(1) + ' kg';
  };

  // 杆长滑块 (改变杆长时清除旧轨迹)
  document.getElementById('L1Slider').oninput = function(e) {
    L1 = parseFloat(e.target.value);
    document.getElementById('L1Val').textContent = L1.toFixed(1) + ' m';
    trajectory = [];
  };
  document.getElementById('L2Slider').oninput = function(e) {
    L2 = parseFloat(e.target.value);
    document.getElementById('L2Val').textContent = L2.toFixed(1) + ' m';
    trajectory = [];
  };

  // 初始角度滑块 (直接设置当前角度并清零角速度)
  document.getElementById('theta1Slider').oninput = function(e) {
    initTheta1Deg = parseFloat(e.target.value);
    theta1 = initTheta1Deg * Math.PI / 180;
    omega1 = 0;
    document.getElementById('theta1Val').textContent = initTheta1Deg.toFixed(0) + '°';
  };
  document.getElementById('theta2Slider').oninput = function(e) {
    initTheta2Deg = parseFloat(e.target.value);
    theta2 = initTheta2Deg * Math.PI / 180;
    omega2 = 0;
    document.getElementById('theta2Val').textContent = initTheta2Deg.toFixed(0) + '°';
  };

  // 阻尼系数滑块
  document.getElementById('dampSlider').oninput = function(e) {
    damping = parseFloat(e.target.value);
    document.getElementById('dampVal').textContent = damping.toFixed(2);
  };

  // 重力滑块
  document.getElementById('gSlider').oninput = function(e) {
    g = parseFloat(e.target.value);
    document.getElementById('gVal').textContent = g.toFixed(1) + ' m/s²';
  };

  // 开始/暂停按钮
  document.getElementById('startBtn').onclick = function() {
    running = !running;
    this.textContent = running ? '暂停' : '开始';
    const dot = document.getElementById('liveDot');
    if (running) {
      dot.classList.add('active');
      lastFrameTime = 0;
    } else {
      dot.classList.remove('active');
    }
  };

  // 重置按钮
  document.getElementById('resetBtn').onclick = function() {
    running = false;
    document.getElementById('startBtn').textContent = '开始';
    document.getElementById('liveDot').classList.remove('active');
    reset();
  };
}

// ============================================================
// 拖拽交互 (鼠标 + 触摸)
// 拖拽摆锤可设置初始角度
// ============================================================
function getPointerPos(e) {
  const rect = simCanvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: t.clientX - rect.left,
    y: t.clientY - rect.top
  };
}

function onPointerDown(e) {
  const pos = getPointerPos(e);
  const p = getPivot();
  const scale = p.scale;

  // 计算两个摆锤的当前画布位置
  const x1 = p.x + L1 * Math.sin(theta1) * scale;
  const y1 = p.y + L1 * Math.cos(theta1) * scale;
  const x2 = x1 + L2 * Math.sin(theta2) * scale;
  const y2 = y1 + L2 * Math.cos(theta2) * scale;

  const d1 = Math.hypot(pos.x - x1, pos.y - y1);
  const d2 = Math.hypot(pos.x - x2, pos.y - y2);
  const r1 = massRadius(m1);
  const r2 = massRadius(m2);

  // 判断点击在哪个摆锤上 (优先选择更近的)
  const can1 = d1 < r1 + 12;
  const can2 = d2 < r2 + 12;
  if (can1 && can2) {
    dragging = d1 <= d2 ? 1 : 2;
  } else if (can1) {
    dragging = 1;
  } else if (can2) {
    dragging = 2;
  }

  if (dragging) {
    e.preventDefault();
    wasRunning = running;
    running = false;
    document.getElementById('startBtn').textContent = '开始';
    document.getElementById('liveDot').classList.remove('active');
    omega1 = 0;
    omega2 = 0;
  }
}

function onPointerMove(e) {
  if (!dragging) return;
  e.preventDefault();

  const pos = getPointerPos(e);
  const p = getPivot();

  if (dragging === 1) {
    // 拖拽摆锤1：以支点为参考计算角度
    // θ从竖直向下方向测量: θ = atan2(Δx, Δy)
    const dx = pos.x - p.x;
    const dy = pos.y - p.y;
    theta1 = Math.atan2(dx, dy);
  } else if (dragging === 2) {
    // 拖拽摆锤2：以摆锤1为参考计算角度
    const scale = p.scale;
    const x1 = p.x + L1 * Math.sin(theta1) * scale;
    const y1 = p.y + L1 * Math.cos(theta1) * scale;
    const dx = pos.x - x1;
    const dy = pos.y - y1;
    theta2 = Math.atan2(dx, dy);
  }

  // 同步更新角度滑块显示
  const d1 = Math.round(normAngle(theta1 * 180 / Math.PI));
  const d2 = Math.round(normAngle(theta2 * 180 / Math.PI));
  document.getElementById('theta1Slider').value = d1;
  document.getElementById('theta2Slider').value = d2;
  document.getElementById('theta1Val').textContent = d1 + '°';
  document.getElementById('theta2Val').textContent = d2 + '°';
  initTheta1Deg = d1;
  initTheta2Deg = d2;
}

function onPointerUp() {
  if (dragging) {
    dragging = null;
    // 如果拖拽前正在运行，恢复运行状态
    if (wasRunning) {
      running = true;
      document.getElementById('startBtn').textContent = '暂停';
      document.getElementById('liveDot').classList.add('active');
      lastFrameTime = 0;
    }
  }
}

// ============================================================
// 初始化
// ============================================================
function init() {
  resizeAll();
  setupControls();
  reset();

  // 鼠标事件
  simCanvas.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  // 触摸事件 (支持移动端)
  simCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
  simCanvas.addEventListener('touchmove', onPointerMove, { passive: false });
  simCanvas.addEventListener('touchend', onPointerUp);
  simCanvas.addEventListener('touchcancel', onPointerUp);

  // 窗口大小变化 (防抖处理)
  let resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeAll, 100);
  });

  // 启动动画循环
  requestAnimationFrame(animate);
}

// DOM就绪后初始化
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
