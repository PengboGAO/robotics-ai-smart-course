<script>
// ============================================================
// 2D机械臂正运动学演示 — 纯Canvas API实现
// ============================================================

// ===== 全局状态 =====
var theta1 = 0;   // 关节角1（度）
var theta2 = 0;   // 关节角2（度）
var theta3 = 0;   // 关节角3（度）
var L1 = 100;     // 连杆1长度（像素）
var L2 = 80;      // 连杆2长度（像素）
var L3 = 60;      // 连杆3长度（像素）

// 末端轨迹记录
var trail = [];           // 轨迹点数组 {x, y}
var MAX_TRAIL = 100;      // 最大轨迹点数

// 播放状态
var isPlaying = false;
var playAnimId = null;

// 画布交互标记（鼠标/触摸点击位置）
var markerPos = null;  // {sx, sy} 屏幕坐标，null表示无标记

// Canvas上下文
var canvas, ctx;
var cw, ch;  // 画布逻辑宽高

// ===== 数学工具函数 =====

// 角度转弧度
function deg2rad(d) { return d * Math.PI / 180; }

// 数值钳制
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// 正运动学计算：根据关节角度和连杆长度计算各关节位置
function forwardKinematics(t1, t2, t3, l1, l2, l3) {
  // 关节角度（弧度）
  var a1 = deg2rad(t1);
  var a2 = deg2rad(t2);
  var a3 = deg2rad(t3);

  // 各关节位置（世界坐标系，Y轴向上）
  var x0 = 0, y0 = 0;                                    // 基座
  var x1 = l1 * Math.cos(a1);                            // 关节1
  var y1 = l1 * Math.sin(a1);
  var x2 = x1 + l2 * Math.cos(a1 + a2);                  // 关节2
  var y2 = y1 + l2 * Math.sin(a1 + a2);
  var x3 = x2 + l3 * Math.cos(a1 + a2 + a3);             // 末端执行器
  var y3 = y2 + l3 * Math.sin(a1 + a2 + a3);

  // 各关节累计角度（用于绘制关节坐标系）
  return {
    joints: [
      { x: x0, y: y0, angle: 0 },
      { x: x1, y: y1, angle: a1 },
      { x: x2, y: y2, angle: a1 + a2 },
      { x: x3, y: y3, angle: a1 + a2 + a3 }
    ],
    endX: x3,
    endY: y3,
    endAngle: a1 + a2 + a3,
    maxReach: l1 + l2 + l3
  };
}

// 世界坐标转屏幕坐标（Y轴翻转）
function w2s(wx, wy, baseX, baseY) {
  return { x: baseX + wx, y: baseY - wy };
}

// ===== Canvas初始化与自适应 =====
function setupCanvas() {
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  cw = rect.width;
  ch = rect.height;
}

// ===== 主渲染函数 =====
function render() {
  // 清空画布
  ctx.clearRect(0, 0, cw, ch);

  // 基座位置（屏幕坐标）
  var baseX = cw / 2;
  var baseY = ch - 50;

  // 计算正运动学
  var fk = forwardKinematics(theta1, theta2, theta3, L1, L2, L3);

  // 1. 绘制背景网格
  drawGrid(baseX, baseY);

  // 2. 绘制工作空间弧
  drawWorkspace(baseX, baseY, fk.maxReach);

  // 3. 绘制末端轨迹
  drawTrail(baseX, baseY);

  // 4. 绘制连杆（渐变色）
  drawLinks(fk.joints, baseX, baseY);

  // 5. 绘制关节坐标系
  drawJointFrames(fk.joints, baseX, baseY);

  // 6. 绘制关节圆点
  drawJoints(fk.joints, baseX, baseY);

  // 7. 绘制末端执行器
  drawEndEffector(fk.joints[3], baseX, baseY);

  // 8. 绘制基座
  drawBase(baseX, baseY);

  // 9. 绘制交互标记（鼠标/触摸位置）
  if (markerPos) {
    drawMarker(markerPos, baseX, baseY);
  }

  // 更新信息显示
  document.getElementById('endCoord').textContent =
    '(' + fk.endX.toFixed(1) + ', ' + fk.endY.toFixed(1) + ')';
  document.getElementById('endAngle').textContent =
    (fk.endAngle * 180 / Math.PI).toFixed(1) + '°';
}

// ===== 绘制背景网格 =====
function drawGrid(baseX, baseY) {
  var step = 25;
  // 普通网格线
  ctx.strokeStyle = 'rgba(37, 99, 235, 0.05)';
  ctx.lineWidth = 1;
  for (var x = baseX % step; x < cw; x += step) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, ch);
    ctx.stroke();
  }
  for (var y = baseY % step; y < ch; y += step) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(cw, y);
    ctx.stroke();
  }
  // 基座水平线（地面）
  ctx.strokeStyle = 'rgba(8, 145, 178, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  ctx.lineTo(cw, baseY);
  ctx.stroke();
  // 基座垂直线
  ctx.beginPath();
  ctx.moveTo(baseX, 0);
  ctx.lineTo(baseX, ch);
  ctx.stroke();
}

// ===== 绘制工作空间弧 =====
function drawWorkspace(baseX, baseY, maxReach) {
  ctx.strokeStyle = 'rgba(245, 158, 11, 0.12)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  // 上半圆弧（工作空间）
  ctx.arc(baseX, baseY, maxReach, Math.PI, 2 * Math.PI);
  ctx.stroke();
  ctx.setLineDash([]);
  // 标注
  ctx.fillStyle = 'rgba(245, 158, 11, 0.35)';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('工作空间 (R=' + maxReach + ')', baseX, baseY - maxReach - 8);
}

// ===== 绘制末端轨迹 =====
function drawTrail(baseX, baseY) {
  if (trail.length < 2) return;
  for (var i = 1; i < trail.length; i++) {
    // 越新的点越亮
    var alpha = (i / trail.length) * 0.6;
    var p1 = w2s(trail[i - 1].x, trail[i - 1].y, baseX, baseY);
    var p2 = w2s(trail[i].x, trail[i].y, baseX, baseY);
    ctx.strokeStyle = 'rgba(245, 158, 11, ' + alpha.toFixed(2) + ')';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
}

// ===== 绘制连杆（渐变色蓝→青） =====
function drawLinks(joints, baseX, baseY) {
  for (var i = 0; i < 3; i++) {
    var p1 = w2s(joints[i].x, joints[i].y, baseX, baseY);
    var p2 = w2s(joints[i + 1].x, joints[i + 1].y, baseX, baseY);
    // 创建沿连杆方向的渐变
    var grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
    grad.addColorStop(0, '#2563eb');
    grad.addColorStop(1, '#0891b2');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
}

// ===== 绘制关节坐标系（小坐标轴） =====
function drawJointFrames(joints, baseX, baseY) {
  var frameSize = 22;
  for (var i = 0; i < 4; i++) {
    var p = w2s(joints[i].x, joints[i].y, baseX, baseY);
    var a = joints[i].angle;
    // x轴（沿连杆方向，红色）
    var xEnd = {
      x: p.x + frameSize * Math.cos(a),
      y: p.y - frameSize * Math.sin(a)
    };
    ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(xEnd.x, xEnd.y);
    ctx.stroke();
    // x轴箭头
    drawSmallArrow(p.x, p.y, xEnd.x, xEnd.y, 'rgba(239, 68, 68, 0.5)');
    // y轴（垂直于连杆，绿色）
    var yEnd = {
      x: p.x - frameSize * Math.sin(a),
      y: p.y - frameSize * Math.cos(a)
    };
    ctx.strokeStyle = 'rgba(34, 197, 94, 0.5)';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(yEnd.x, yEnd.y);
    ctx.stroke();
    // y轴箭头
    drawSmallArrow(p.x, p.y, yEnd.x, yEnd.y, 'rgba(34, 197, 94, 0.5)');
    // 关节编号标签
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('{J' + i + '}', p.x + 6, p.y + 14);
  }
}

// ===== 绘制小箭头 =====
function drawSmallArrow(x1, y1, x2, y2, color) {
  var ang = Math.atan2(y2 - y1, x2 - x1);
  var len = 5;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - len * Math.cos(ang - Math.PI / 6), y2 - len * Math.sin(ang - Math.PI / 6));
  ctx.lineTo(x2 - len * Math.cos(ang + Math.PI / 6), y2 - len * Math.sin(ang + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
}

// ===== 绘制关节圆点 =====
function drawJoints(joints, baseX, baseY) {
  for (var i = 0; i < 4; i++) {
    var p = w2s(joints[i].x, joints[i].y, baseX, baseY);
    // 外圈：白色填充 + 蓝色边框
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // 中心点
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#2563eb';
    ctx.fill();
  }
}

// ===== 绘制末端执行器（方形+十字线） =====
function drawEndEffector(joint, baseX, baseY) {
  var p = w2s(joint.x, joint.y, baseX, baseY);
  var a = joint.angle;
  var size = 12;
  ctx.save();
  ctx.translate(p.x, p.y);
  // 旋转坐标系对齐连杆方向（注意Y轴翻转，取负角度）
  ctx.rotate(-a);
  // 方形边框
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(-size, -size, size * 2, size * 2);
  // 十字线
  ctx.beginPath();
  ctx.moveTo(-size * 1.6, 0);
  ctx.lineTo(size * 1.6, 0);
  ctx.moveTo(0, -size * 1.6);
  ctx.lineTo(0, size * 1.6);
  ctx.stroke();
  ctx.restore();
  // 末端标签
  ctx.fillStyle = '#f59e0b';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('末端', p.x + 16, p.y - 12);
}

// ===== 绘制基座 =====
function drawBase(baseX, baseY) {
  // 基座矩形
  ctx.fillStyle = 'rgba(37, 99, 235, 0.3)';
  ctx.fillRect(baseX - 25, baseY, 50, 15);
  ctx.strokeStyle = '#2563eb';
  ctx.lineWidth = 2;
  ctx.strokeRect(baseX - 25, baseY, 50, 15);
  // 地面线
  ctx.strokeStyle = 'rgba(8, 145, 178, 0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(baseX - 70, baseY + 15);
  ctx.lineTo(baseX + 70, baseY + 15);
  ctx.stroke();
  // 地面斜线
  ctx.strokeStyle = 'rgba(8, 145, 178, 0.25)';
  ctx.lineWidth = 1;
  for (var i = -60; i <= 60; i += 10) {
    ctx.beginPath();
    ctx.moveTo(baseX + i, baseY + 15);
    ctx.lineTo(baseX + i - 8, baseY + 23);
    ctx.stroke();
  }
}

// ===== 绘制交互标记（鼠标/触摸点击位置） =====
function drawMarker(pos, baseX, baseY) {
  var wx = pos.sx - baseX;
  var wy = baseY - pos.sy;
  // 十字线
  ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(pos.sx - 20, pos.sy);
  ctx.lineTo(pos.sx + 20, pos.sy);
  ctx.moveTo(pos.sx, pos.sy - 20);
  ctx.lineTo(pos.sx, pos.sy + 20);
  ctx.stroke();
  ctx.setLineDash([]);
  // 标记点
  ctx.beginPath();
  ctx.arc(pos.sx, pos.sy, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#f59e0b';
  ctx.fill();
  // 坐标标签
  ctx.fillStyle = 'rgba(245, 158, 11, 0.8)';
  ctx.font = '10px Courier New, monospace';
  ctx.textAlign = 'left';
  ctx.fillText('(' + wx.toFixed(0) + ', ' + wy.toFixed(0) + ')', pos.sx + 8, pos.sy - 8);
}

// ===== 记录末端轨迹 =====
function recordTrail() {
  var fk = forwardKinematics(theta1, theta2, theta3, L1, L2, L3);
  trail.push({ x: fk.endX, y: fk.endY });
  if (trail.length > MAX_TRAIL) trail.shift();
}

// ===== 同步滑块和数值显示 =====
function syncSliders() {
  document.getElementById('sliderT1').value = theta1;
  document.getElementById('sliderT2').value = theta2;
  document.getElementById('sliderT3').value = theta3;
  document.getElementById('sliderL1').value = L1;
  document.getElementById('sliderL2').value = L2;
  document.getElementById('sliderL3').value = L3;
  document.getElementById('valT1').textContent = Math.round(theta1) + '°';
  document.getElementById('valT2').textContent = Math.round(theta2) + '°';
  document.getElementById('valT3').textContent = Math.round(theta3) + '°';
  document.getElementById('valL1').textContent = Math.round(L1);
  document.getElementById('valL2').textContent = Math.round(L2);
  document.getElementById('valL3').textContent = Math.round(L3);
}

// ===== 重置 =====
function reset() {
  stopPlay();
  theta1 = 0;
  theta2 = 0;
  theta3 = 0;
  L1 = 100;
  L2 = 80;
  L3 = 60;
  trail = [];
  syncSliders();
  render();
}

// ===== 播放轨迹动画 =====
function playTrajectory() {
  if (isPlaying) {
    stopPlay();
    return;
  }
  isPlaying = true;
  document.getElementById('playBtn').textContent = '停止播放';
  trail = [];  // 清空旧轨迹
  var startTime = Date.now();
  var duration = 8000;  // 8秒一个周期

  function animate() {
    if (!isPlaying) return;
    var elapsed = Date.now() - startTime;
    var t = (elapsed % duration) / duration;  // 归一化时间 0~1

    // 使用不同频率和相位的正弦波生成平滑轨迹
    theta1 = 60 * Math.sin(2 * Math.PI * t);
    theta2 = 80 * Math.sin(2 * Math.PI * t + Math.PI / 3);
    theta3 = 60 * Math.sin(2 * Math.PI * t + 2 * Math.PI / 3);

    syncSliders();
    recordTrail();
    render();

    if (elapsed < duration) {
      playAnimId = requestAnimationFrame(animate);
    } else {
      stopPlay();
    }
  }
  animate();
}

// ===== 停止播放 =====
function stopPlay() {
  isPlaying = false;
  if (playAnimId) {
    cancelAnimationFrame(playAnimId);
    playAnimId = null;
  }
  document.getElementById('playBtn').textContent = '播放轨迹';
}

// ===== 事件绑定 =====
function setupEvents() {
  // 关节角度滑块
  var angleIds = ['T1', 'T2', 'T3'];
  var angleVars = ['theta1', 'theta2', 'theta3'];
  for (var i = 0; i < 3; i++) {
    (function(idx) {
      document.getElementById('slider' + angleIds[idx]).addEventListener('input', function(e) {
        var val = parseFloat(e.target.value);
        if (idx === 0) theta1 = val;
        else if (idx === 1) theta2 = val;
        else theta3 = val;
        document.getElementById('val' + angleIds[idx]).textContent = Math.round(val) + '°';
        recordTrail();
        render();
      });
    })(i);
  }

  // 连杆长度滑块
  var lenIds = ['L1', 'L2', 'L3'];
  for (var i = 0; i < 3; i++) {
    (function(idx) {
      document.getElementById('slider' + lenIds[idx]).addEventListener('input', function(e) {
        var val = parseFloat(e.target.value);
        if (idx === 0) L1 = val;
        else if (idx === 1) L2 = val;
        else L3 = val;
        document.getElementById('val' + lenIds[idx]).textContent = Math.round(val);
        trail = [];  // 连杆长度变化时清除轨迹
        render();
      });
    })(i);
  }

  // 按钮
  document.getElementById('playBtn').addEventListener('click', playTrajectory);
  document.getElementById('resetBtn').addEventListener('click', reset);

  // ===== 鼠标事件：点击画布显示坐标标记 =====
  canvas.addEventListener('mousedown', function(e) {
    var rect = canvas.getBoundingClientRect();
    markerPos = { sx: e.clientX - rect.left, sy: e.clientY - rect.top };
    render();
  });
  canvas.addEventListener('mousemove', function(e) {
    if (e.buttons === 1) {  // 按住左键拖动时更新标记
      var rect = canvas.getBoundingClientRect();
      markerPos = { sx: e.clientX - rect.left, sy: e.clientY - rect.top };
      render();
    }
  });
  canvas.addEventListener('mouseleave', function() {
    markerPos = null;
    render();
  });

  // ===== 触摸事件：支持触摸交互 =====
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    markerPos = { sx: t.clientX - rect.left, sy: t.clientY - rect.top };
    render();
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    var t = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    markerPos = { sx: t.clientX - rect.left, sy: t.clientY - rect.top };
    render();
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    markerPos = null;
    render();
  }, { passive: false });

  // 窗口大小变化
  window.addEventListener('resize', function() {
    setupCanvas();
    render();
  });
}

// ===== 初始化 =====
function init() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  setupCanvas();
  setupEvents();
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
